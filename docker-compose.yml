version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - '3000:3000'
    environment:
      RAG_API_URL: http://rag-api:5000
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - rag-api

  frontend:
    build: ./frontend
    ports:
      - '8080:80'
    depends_on:
      - backend

  rag-api:
    build: ./rag-api
    ports:
      - '5000:5000'
    environment:
      UPLOAD_DIR: /app/uploads
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-500}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-3}
    volumes:
      - ./backend/uploads:/app/uploads
